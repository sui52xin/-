<!DOCTYPE html>
<html lang="zh-CN">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>网页标题</title>            <!--网页标题-->
     <style>                            
        .navbar{                                         
             display:flex ;                         
             justify-content: space-between;            /*一左一右*/
             align-items: center;
             padding: 15px 40px;                       /*上下+左右*/
             height: 50px;
             background: linear-gradient(to right,#333,#555);      /*背景颜色*/
             font-family: "Arial",sans-serif;         /*字体*/
             color: #fff;                           /*颜色*/
        }
        .mask{                                       /*巴蜀四季*/
             display: flex;
             gap: 25px;
             font-size: 30px;
             background: linear-gradient(to right,#4facfe,#a445b2);     /*巴蜀四季的颜色*/
             -webkit-background-clip: text;
             -webkit-text-fill-color: transparent;
             background-clip: text;
             color: transparent;
        }
        .navItem{                         /*春夏秋冬*/
             display: flex;
             gap: 25px;            /* 每个字之间的间距 */
             list-style: none;     /* 去掉小圆点 */
             padding: 0;
             margin: 0;
        }
        .navItem li{
             color:#fff ;
             transition: color 0.3s;
             cursor: pointer;
        }
        .navList1:hover{
             color: greenyellow;
        }
        .navList2:hover{
             color: rgb(244, 40, 4);
        }
        .navList3:hover{
             color: gold;
        }
        .navList4:hover{
             color: lightcyan;
        }                                    /*春夏秋冬颜色结束*/
        body {
             background-image: url("../ing/dicengbijingt");       /*底层背景图*/
        }
        h1 {
             text-align: center;
             color: #000;
        }
        .footer{
             display:flex ;                         
             flex-direction: column;
              gap: 20px;
             padding: 60px 80px 30px 80px;  
             background: linear-gradient(to right,#333,#555);      /*背景颜色*/
             font-family: "Arial",sans-serif;         /*字体*/
             color: #fff;                           /*颜色*/
        }
        .footer-Logo{
             margin-bottom: 80px;
             letter-spacing: 2px;
             font-weight: 900;
             font-size: 56px;
        }
        .footer-jiemian2{
             display: flex;
             justify-content: space-between;
             align-items: flex-start;
             gap: 60px;
        }
        .footer-xiaoyu{
             font-size: 15px;
             line-height: 1.8;
             margin-bottom: 20px;
             color: #ddd;
        }
        .footer-qr img{
             display: block;
             flex-direction:column;
             height: auto;
             max-width: 90px;
        }
        .footer-jiemian3{
             display: flex;
             justify-content: space-between;
             font-size: 13px;
             line-height: 1.8;
             padding-top: 20px;
             border-top:1px solid #444;
             color: #888;
        }
        .footer-jiemian3 p{
            margin: 0;
        }
     </style> 
</head>
<body style>
    <header class="fxc active down">                  <!--第一部分-->
       <nav class="navbar">
        <div class="mask">巴蜀四季</div>
        <div class="col fxb">
            <ul class="navItem">
                <li class="navList1">春</li>
                <li class="navList2">夏</li>
                <li class="navList3">秋</li>
                <li class="navList4">冬</li>
            </ul>
        </div>
       </nav>
    </header>
    <main>                   <!--主体-->
        <section  class="page1">            <!--图片+视频-->
            <div class="picture1">
                图片
            </div>
             <div class="video1">
                视频
            </div>
             <div class="title1">
                图片
            </div>
        </section>
        <section class="page2">          <!--四川地图-->
            <div class="map-section">
                四川地图
            </div>
        </section>
        <section class="page3">           <!--时间线-->
            <div>

            </div>
        </section>
        <section class="page4">         <!--起源-->
            <div class="origin-section">
                起源
            </div>
        </section>
        
    </main>
    <footer class="footer">                              <!--页脚-->
       
             <div class="footer-Logo">巴蜀四季</div>    <!--logo-->
             <div class="footer-jiemian2">                      <!--结面2-->
                 <div class="footer-xiaoyu">                <!--小语-->
                     春花秋月何时了？往事知多少。<br>
                     小楼昨夜又东风，故国不堪回首月明中。<br>
                     雕栏玉砌应犹在，只是朱颜改。<br>
                     问君能有几多愁？恰似一江春水向东流。
                 </div>
        
                <div class="footer-qr">                     <!--二维码-->
                     <img src="../ing/微信图片.jpg" alt="二维码">          
                 </div>
             </div>
             <div class="footer-jiemian3">                   <!--结面3-->
                 <p >            <!--网站版权说明-->
                     © 2021-2026 Fujian Nanping Nanfu Battery Co., Ltd. All Rights Reserved
                 </p>
                 <p>                                  <!--设计申明-->
                    Web Designed by uunn.cn
                 </p>
             </div>
    </footer>
</body>erweima
</html>
