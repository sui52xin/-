<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>"网页开场视频"</title>
        <style>
            /*全局设置*/
             * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            /*网页主体*/
            body{
                min-height: 100vh;
                display:#f4f4f4 ;
                font-family: "Microsoft YaHei", sans-serif;
            }
            /*开场视频层遮罩层*/
            .intro-lay{
                position: fixed;
                inset: 0;
                z-index: 9999;
                display:grid;
                place-items: center;
                background:#000;
                transition:opacity 0.6s ease,visibility 0.6s ease;
            }
            /*视频结束状态*/
            .intro-layer.is-finsined{
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
            /*结束开场视频样式*/
            .intro-layer video{
                width: 100%;
                height: 100%;
                object-fit: cover;
                background:#000;
            }
            /*结束自动播放时的按钮*/
            .video-fallback{
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%,-50%);
                padding: 14px 22px;
                color:#fff;
                broder:0;
                
                font-size: 1.5rem;
                cursor: pointer;
            }
        </style>
    </head>
